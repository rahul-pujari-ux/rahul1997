<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; }
        h1 { color: #333; }
        .date { color: #666; margin-bottom: 20px; }
        .event { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 5px; background-color: #f9f9f9; }
        .event-time { color: #0066cc; font-weight: bold; }
        .event-title { font-size: 18px; margin: 5px 0; }
        .event-desc { color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Calendar Dashboard</h1>
    <div class="date">Today: {{ today }}</div>

    <h2>Events</h2>
    {% if events %}
        {% for event in events %}
            <div class="event">
                <div class="event-time">{{ event.time }}</div>
                <div class="event-title">{{ event.title }}</div>
                <div class="event-desc">{{ event.description }}</div>
            </div>
        {% endfor %}
    {% else %}
        <p>No events for today</p>
    {% endif %}
</body>
</html>
